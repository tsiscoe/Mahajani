[package]
name = "mahajani"
version = "1.2.0"
edition = "2024"
authors = ["tsiscoe <tsiscoe@users.noreply.github.com>"]
description = "OpenPGP & RSA Public-Key Challenge-Response Authenticated FTP Server with In-Band Provisioning and Traversal IDS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tsiscoe/mahajani"

[dependencies]
pgp = "0.21.0"
rsa = "0.9"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.10"

[lints.rust]
unsafe_code = "forbid"

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
